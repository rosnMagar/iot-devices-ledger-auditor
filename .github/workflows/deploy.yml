name: Deploy

on:
  push:
    branches: [dev, prod]

jobs:
  build-push:
    name: Build & push images (${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set frontend API URL
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "FRONTEND_API_URL=http://${{ secrets.EC2_HOST }}:8000" >> $GITHUB_ENV
          else
            echo "FRONTEND_API_URL=http://localhost:8000" >> $GITHUB_ENV
          fi

      # Required to cross-build linux/arm64 images on GitHub's x86 runners.
      # Without it buildx silently produces amd64 images, which fail on the
      # t4g (Graviton) instance with "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push storage-core
        uses: docker/build-push-action@v5
        with:
          context: ./storage-core
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/storage-core:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building an image only proves it compiles — nothing here ever ran the
      # binary. Two deploy-blocking bugs shipped green through this job that
      # way: an x86 binary inside an arm64 image (IOT-42), then a libstdc++
      # version mismatch (IOT-43). Both would have failed on the first request
      # here. Runs the real arm64 image under the QEMU set up above.
      - name: Smoke test storage-core image
        run: |
          image=ghcr.io/${{ steps.owner.outputs.value }}/storage-core:${{ github.ref_name }}
          docker run -d --name smoke --platform linux/arm64 -p 18080:8080 "$image"

          for i in $(seq 1 30); do
            if curl -fsS localhost:18080/health > /dev/null; then
              echo "image starts and serves /health after $((i * 2))s"
              docker rm -f smoke > /dev/null
              exit 0
            fi
            sleep 2
          done

          echo "storage-core image did not serve /health within 60s" >&2
          docker logs smoke >&2
          docker rm -f smoke > /dev/null
          exit 1

      - name: Build & push backend-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend-api
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/backend-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/frontend:${{ github.ref_name }}
          build-args: VITE_API_BASE_URL=${{ env.FRONTEND_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Deploy to EC2
    needs: build-push
    if: github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/audit-ledger
            git pull origin prod

            # TAG is set here rather than read from the box's .env. It used to
            # come from that file, so a missing or stale .env meant compose fell
            # back to :dev and deployed development images to production while
            # reporting success. The deploy now states the tag it means.
            export TAG=prod

            # Same reasoning: CORS_ORIGINS defaults to the Vite dev server
            # (http://localhost:5173), which is never the production origin. The
            # frontend is served by nginx on :80, so the browser sends
            # Origin: http://<host> when calling backend-api on :8000 — a
            # cross-origin request that was being rejected. Derived from
            # EC2_HOST so it can't drift from the address actually in use.
            export CORS_ORIGINS=http://${{ secrets.EC2_HOST }}

            docker compose pull
            docker compose up -d

            # `up -d` exits 0 as soon as the container is created, so a container
            # that crash-loops still looks like a successful deploy. Poll /health
            # and fail the job if it never answers.
            for i in $(seq 1 30); do
              if curl -fsS localhost:8080/health > /dev/null; then
                echo "storage-core healthy after $((i * 2))s"
                exit 0
              fi
              sleep 2
            done

            echo "storage-core did not become healthy within 60s" >&2
            docker compose ps >&2
            docker compose logs --tail=50 storage-core >&2
            exit 1

  deploy-lambda:
    name: Deploy auditor Lambda
    needs: build-push
    if: github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
        working-directory: auditor

      - run: npm run build
        working-directory: auditor

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - run: pip install aws-sam-cli

      - name: SAM build & deploy
        working-directory: auditor
        run: |
          sam build
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "StorageCoreUrl=http://${{ secrets.EC2_HOST }}:8080"
