services:
  storage-core:
    image: ghcr.io/rosnmagar/storage-core:${TAG:?TAG is not set — set it in .env (dev or prod), see docs/deployment.md}
    build: ./storage-core
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LEDGER_PATH: ${LEDGER_PATH:-/app/data/ledger.log}
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:8080}
      WS_BIND_ADDR: ${WS_BIND_ADDR:-0.0.0.0:8081}
    volumes:
      - ledger-data:/app/data
    restart: unless-stopped

  backend-api:
    image: ghcr.io/rosnmagar/backend-api:${TAG:?TAG is not set — set it in .env (dev or prod), see docs/deployment.md}
    build: ./backend-api
    ports:
      - "8000:8000"
    environment:
      STORAGE_CORE_URL: ${STORAGE_CORE_URL:-http://storage-core:8080}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      - storage-core
    restart: unless-stopped

  frontend:
    image: ghcr.io/rosnmagar/frontend:${TAG:?TAG is not set — set it in .env (dev or prod), see docs/deployment.md}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is not set — it is baked into the frontend bundle at build time, see docs/deployment.md}
    ports:
      - "80:80"
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  ledger-data:
