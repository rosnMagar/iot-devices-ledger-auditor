services:
  storage-core:
    image: ghcr.io/rosnmagar/storage-core:${TAG:-dev}
    build: ./storage-core
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LEDGER_PATH: ${LEDGER_PATH:-/app/data/ledger.log}
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:8080}
    volumes:
      - ledger-data:/app/data
    restart: unless-stopped

  backend-api:
    image: ghcr.io/rosnmagar/backend-api:${TAG:-dev}
    build: ./backend-api
    ports:
      - "8000:8000"
    environment:
      STORAGE_CORE_URL: ${STORAGE_CORE_URL:-http://storage-core:8080}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      - storage-core
    restart: unless-stopped

  frontend:
    image: ghcr.io/rosnmagar/frontend:${TAG:-dev}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  ledger-data:
